controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_position_example_controller:
      type: position_controllers/JointGroupPositionController

    joint_velocity_example_controller:
      type: velocity_controllers/JointGroupVelocityController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_position_example_controller:
  ros__parameters:
    joints:
      - fer_joint1 
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7

gripper_controller:
  ros__parameters:
    action_monitor_rate: 20.0
    allow_stalling: false
    goal_tolerance: 0.01
    joint: 'fer_finger_joint1'
    max_effort: 0.0
    stall_timeout: 1.0
    stall_velocity_threshold: 0.001
    
joint_velocity_example_controller:
  ros__parameters:
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    interface_name: velocity
  
joint_trajectory_controller:
  ros__parameters:
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      fer_joint1: { trajectory: 0.2, goal: 0.1 }
      fer_joint2: { trajectory: 0.2, goal: 0.1 }
      fer_joint3: { trajectory: 0.2, goal: 0.1 }
      fer_joint4: { trajectory: 0.2, goal: 0.1 }
      fer_joint5: { trajectory: 0.2, goal: 0.1 }
      fer_joint6: { trajectory: 0.2, goal: 0.1 }
      fer_joint7: { trajectory: 0.2, goal: 0.1 }